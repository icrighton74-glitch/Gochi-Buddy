<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Companion - Pure Avatar</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --font-color: #00f2ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--font-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease-in-out;
            width: 100%;
            height: 100%;
        }

        #avatar-window {
            width: 75vmin;
            height: 75vmin;
            max-width: 550px;
            max-height: 550px;
            border: 5px solid var(--font-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: border-width 0.1s ease, border-color 0.3s ease, box-shadow 0.2s ease;
        }

        #display-container {
            text-align: center;
            /* Added smooth transitions for the 'Splat' effect */
            transition: transform 0.15s cubic-bezier(0.17, 0.67, 0.83, 0.67), filter 0.2s;
        }

        #face {
            font-size: 18vmin;
            font-weight: bold;
            display: inline-block;
            white-space: nowrap;
            transition: transform 0.1s ease-in-out;
            user-select: none;
        }

        .blink-action {
            transform: scaleY(0.1);
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        button {
            padding: 12px 18px;
            background: var(--font-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            opacity: 0.15;
            transition: opacity 0.3s ease;
        }

        button:hover { opacity: 1; }

        .shake-active { animation: window-shake 0.1s infinite; }

        @keyframes window-shake {
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, -2px); }
            100% { transform: translate(2px, 2px); }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="cycleTheme()">THEME</button>
        <button onclick="toggleOrientation()">ROTATE</button>
    </div>

    <div id="main-layout">
        <div id="avatar-window">
            <div id="display-container">
                <div id="face">•‿•</div>
            </div>
        </div>
    </div>

    <script>
        const faceEl = document.getElementById('face');
        const containerEl = document.getElementById('display-container');
        const layoutEl = document.getElementById('main-layout');
        const avatarWindow = document.getElementById('avatar-window');
        const root = document.documentElement;

        let themeIndex = 0;
        const themes = [
            { bg: "#0a0a0a", font: "#00f2ff" }, 
            { bg: "#ffffff", font: "#000000" }, 
            { bg: "#00ff00", font: "#000000" }, 
            { bg: "#0000ff", font: "#ffffff" }, 
            { bg: "#ff0000", font: "#ffffff" }  
        ];

        function cycleTheme() {
            themeIndex = (themeIndex + 1) % themes.length;
            root.style.setProperty('--bg-color', themes[themeIndex].bg);
            root.style.setProperty('--font-color', themes[themeIndex].font);
        }

        let isHorizontal = false;
        function toggleOrientation() {
            isHorizontal = !isHorizontal;
            layoutEl.style.transform = isHorizontal ? "rotate(-90deg)" : "rotate(0deg)";
        }

        let speed = 0, accel = 0, turn = 0, pitch = 0;
        let isOverriding = false; 

        const expressions = {
            idle: "-◡-",
            cruising: "•‿•",
            accelerating: "O_o",
            braking: ">_<",
            turningLeft: "<_<",
            turningRight: ">_>",
            uphill: "°◡°",
            highSpeed: "*~*",
        };

        const randomExpressions = ["-◡-", ">◡<", "^ ◡ ^", "=◡=", "o_O", "~_o", "o_~", "°~°", "€_€"];

        function updateCompanion() {
            if (isOverriding) return; 

            let currentFace = expressions.cruising;
            let tilt = 0;
            let splatX = 0;
            let splatScale = 1;

            // Splat Logic: If deceleration is high, move the face and squash it
            if (accel < -9) {
                currentFace = expressions.braking;
                splatX = -40; // Moves "forward" toward the glass
                splatScale = 1.3; // Stretches width
            }

            if (speed < 5) {
                currentFace = expressions.idle;
                avatarWindow.classList.remove('shake-active');
            } else if (accel > 8) {
                currentFace = expressions.accelerating;
                avatarWindow.classList.add('shake-active');
            } else if (turn < -4) {
                currentFace = expressions.turningLeft;
                tilt = -12;
                avatarWindow.classList.remove('shake-active');
            } else if (turn > 4) {
                currentFace = expressions.turningRight;
                tilt = 12;
                avatarWindow.classList.remove('shake-active');
            } else {
                avatarWindow.classList.remove('shake-active');
            }

            // Window Border thickness scales with speed + impact force
            let forceModifier = Math.abs(accel) / 2;
            let thickness = 4 + (speed / 10) + forceModifier;
            avatarWindow.style.borderWidth = `${thickness}px`;

            // Apply splat and movement
            faceEl.innerText = currentFace;
            containerEl.style.transform = `
                rotate(${tilt}deg) 
                translateY(${pitch * -1}px) 
                translateX(${splatX}px) 
                scaleX(${splatScale})
            `;
        }

        function triggerBlink() {
            if (accel < -9) { scheduleNextBlink(); return; } // Don't blink while splatting
            faceEl.classList.add('blink-action');
            setTimeout(() => {
                faceEl.classList.remove('blink-action');
                scheduleNextBlink();
            }, 120);
        }

        function scheduleNextBlink() {
            setTimeout(triggerBlink, Math.random() * 4000 + 2000);
        }

        function triggerRandomFace() {
            isOverriding = true;
            faceEl.innerText = randomExpressions[Math.floor(Math.random() * randomExpressions.length)];
            setTimeout(() => {
                isOverriding = false;
                updateCompanion();
                scheduleNextRandom();
            }, 1800);
        }

        function scheduleNextRandom() {
            setTimeout(triggerRandomFace, Math.random() * 57000 + 3000);
        }

        setInterval(() => {
            // Simulator: Added a "hard brake" phase to the cycle to trigger Splat
            speed = Math.abs(Math.sin(Date.now() / 5000) * 120);
            accel = Math.cos(Date.now() / 2500) * 15; // Increased range to trigger splat logic
            turn = Math.sin(Date.now() / 3000) * 8;
            pitch = Math.sin(Date.now() / 10000) * 15;
            updateCompanion();
        }, 100);

        scheduleNextRandom(); 
        scheduleNextBlink();
    </script>
</body>
</html>
