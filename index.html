<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>AI Car Companion - Ultimate Edition</title>
    <style>
        :root { --bg: #000; --white: #fff; --red: #ff4747; --blue: #77b5fe; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Courier New', Courier, monospace; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; touch-action: manipulation; transition: background 0.2s; }
        
        #container { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 500px; }
        
        #stage { position: relative; width: 320px; height: 400px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s linear; }
        .face { display: none; flex-direction: column; align-items: center; }
        .active { display: flex; }

        .nav-arrow { background: none; border: none; color: rgba(255,255,255,0.3); font-size: 40px; cursor: pointer; padding: 20px; z-index: 20; transition: color 0.2s; user-select: none; }
        .nav-arrow:active { color: var(--blue); }

        /* Eyes */
        .eye { width: 70px; height: 90px; background: var(--white); border-radius: 30px; margin: 0 30px; transition: height 0.2s, background 0.3s; position: relative; overflow: hidden; }
        .row { display: flex; align-items: center; justify-content: center; }
        
        .pupil { position: absolute; width: 0; height: 0; border-top: 25px solid transparent; border-bottom: 25px solid transparent; top: 20px; transition: transform 0.2s; visibility: hidden; }
        .eye-left .pupil { border-right: 35px solid #000; left: 10px; }
        .eye-right .pupil { border-left: 35px solid #000; right: 10px; }
        .looking .pupil { visibility: visible; }

        /* Scrunched Eyes (Used for >_<) */
        .scrunched-container { width: 70px; height: 60px; position: relative; margin: 0 30px; }
        .scrunched-container::before, .scrunched-container::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 10px; background: var(--white); border-radius: 5px; }
        
        /* Left Eye > */
        .s-eye-left::before { transform: rotate(45deg); }
        .s-eye-left::after { transform: rotate(-45deg); }
        
        /* Right Eye < */
        .s-eye-right::before { transform: rotate(-45deg); }
        .s-eye-right::after { transform: rotate(45deg); }

        /* Mouths */
        .mouth { width: 50px; height: 20px; border-bottom: 6px solid var(--white); border-radius: 50%; margin-top: 30px; position: relative; transition: all 0.3s; }
        .shock-mouth { width: 60px; height: 40px; border: 6px solid var(--white); border-radius: 40%; margin-top: 30px; }

        /* Gauge with Dynamic Glow */
        .gauge { width: 240px; height: 240px; border: 4px solid var(--white); border-radius: 50%; position: relative; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .needle { position: absolute; bottom: 50%; left: calc(50% - 2px); width: 4px; height: 100px; background: var(--red); transform-origin: bottom; transition: transform 0.2s; z-index: 5; border-radius: 2px; }
        .speed-label { position: absolute; width: 30px; height: 20px; text-align: center; font-size: 14px; font-weight: bold; color: var(--white); transform: translate(-50%, -50%); transition: color 0.3s; }

        /* Background Flash */
        .flash-red { background: #500 !important; }

        .danger-mode { border-color: var(--red); box-shadow: 0 0 25px var(--red); animation: pulse-red 1s infinite alternate; }
        .danger-text { color: var(--red) !important; }

        @keyframes pulse-red {
            from { box-shadow: 0 0 10px var(--red); }
            to { box-shadow: 0 0 30px var(--red); }
        }

        .sleepy { height: 10px !important; }

        #controls { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; }
        button { background: rgba(255,255,255,0.1); border: 1px solid #fff; color: #fff; padding: 12px 20px; border-radius: 8px; z-index: 10; font-weight: bold; cursor: pointer; }
        #stats { position: absolute; bottom: 20px; font-family: monospace; font-size: 12px; color: #666; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="start-btn" onclick="initCompanion()">START COMPANION</button>
    </div>

    <div id="container">
        <button class="nav-arrow" onclick="cycleFace(-1)">&#10094;</button>

        <div id="stage">
            <div id="face-idle" class="face active">
                <div class="row">
                    <div class="eye eye-left"><div class="pupil"></div></div>
                    <div class="eye eye-right"><div class="pupil"></div></div>
                </div>
                <div class="mouth"></div>
            </div>

            <div id="face-stop" class="face">
                <div class="row">
                    <div class="scrunched-container s-eye-left"></div>
                    <div class="scrunched-container s-eye-right"></div>
                </div>
                <div class="shock-mouth"></div>
            </div>

            <div id="face-speed" class="face">
                <div class="gauge" id="speed-gauge">
                    <div id="needle" class="needle"></div>
                </div>
                <div style="margin-top:20px; color:var(--red); font-weight:bold;">SLOW DOWN!</div>
            </div>
        </div>

        <button class="nav-arrow" onclick="cycleFace(1)">&#10095;</button>
    </div>

    <div id="stats">
        SPD: <span id="s-val">0</span> | G: <span id="g-val">0</span> | TILT: <span id="t-val">0</span>
    </div>

    <script>
        let currentSpeed = 0, gForce = 0, tilt = 0, isAnimating = false, wakeLock = null;
        let manualOverride = false;
        const faceIds = ['face-idle', 'face-stop', 'face-speed'];
        let currentFaceIndex = 0;

        function createSpeedLabels() {
            const gauge = document.getElementById('speed-gauge');
            for (let i = 0; i <= 140; i += 20) {
                const label = document.createElement('div');
                label.className = 'speed-label';
                label.innerText = i;
                const angle = 135 + (i / 140) * 270;
                const rad = angle * (Math.PI / 180);
                label.style.left = (120 + 95 * Math.cos(rad)) + 'px';
                label.style.top = (120 + 95 * Math.sin(rad)) + 'px';
                gauge.appendChild(label);
            }
        }
        createSpeedLabels();

        function initCompanion() {
            document.getElementById('controls').style.display = 'none';
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => { if (res == 'granted') startMotion(); });
            } else { startMotion(); }
            
            navigator.geolocation.watchPosition((pos) => {
                currentSpeed = (pos.coords.speed || 0) * 2.237; 
                document.getElementById('s-val').innerText = Math.round(currentSpeed);
            }, null, { enableHighAccuracy: true });

            update();
        }

        function startMotion() {
            window.addEventListener('devicemotion', (e) => {
                let rawG = e.accelerationIncludingGravity ? e.accelerationIncludingGravity.y : 0;
                gForce = rawG; // Tracking decel
                document.getElementById('g-val').innerText = gForce.toFixed(2);
                let rawTilt = e.accelerationIncludingGravity ? e.accelerationIncludingGravity.x : 0;
                tilt = rawTilt * 5;
                document.getElementById('t-val').innerText = Math.round(tilt);
            });
        }

        function cycleFace(dir) {
            manualOverride = true;
            currentFaceIndex = (currentFaceIndex + dir + faceIds.length) % faceIds.length;
            switchFace(faceIds[currentFaceIndex]);
            clearTimeout(window.overrideTimeout);
            window.overrideTimeout = setTimeout(() => { manualOverride = false; }, 5000);
        }

        function switchFace(id) {
            document.querySelectorAll('.face').forEach(f => f.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function update() {
            const needle = document.getElementById('needle');
            const gauge = document.getElementById('speed-gauge');
            const stage = document.getElementById('stage');
            
            stage.style.transform = `rotate(${tilt}deg)`;

            if (!manualOverride) {
                // SUDDEN STOP DETECTION (G-force spike)
                // Adjust -8 based on how sensitive you want the "braking" to be
                if (gForce < -8) {
                    switchFace('face-stop');
                    document.body.classList.add('flash-red');
                    setTimeout(() => document.body.classList.remove('flash-red'), 500);
                } else if (currentSpeed > 75) {
                    switchFace('face-speed');
                } else {
                    switchFace('face-idle');
                }
            }

            // Update Needle
            let needleAngle = -135 + (Math.min(currentSpeed, 140) / 140) * 270;
            if(needle) needle.style.transform = `rotate(${needleAngle}deg)`;
            
            // Speedometer Glow
            if (currentSpeed > 75) gauge.classList.add('danger-mode');
            else gauge.classList.remove('danger-mode');

            requestAnimationFrame(update);
        }

        // Automatic Blinking for Idle Face
        setInterval(() => {
            const idleFace = document.getElementById('face-idle');
            if(idleFace.classList.contains('active')) {
                const eyes = idleFace.querySelectorAll('.eye');
                eyes.forEach(e => e.style.height = '5px');
                setTimeout(() => eyes.forEach(e => e.style.height = '90px'), 150);
            }
        }, 4000);

    </script>
</body>
</html>
