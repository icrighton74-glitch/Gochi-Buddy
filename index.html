<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Car Companion - Ultimate Edition</title>
    <style>
        :root { --bg: #000; --white: #fff; --red: #ff4747; --blue: #77b5fe; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        #stage { position: relative; width: 320px; height: 400px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s linear; }
        .face { display: none; flex-direction: column; align-items: center; }
        .active { display: flex; }

        /* Eyes */
        .eye { width: 70px; height: 90px; background: var(--white); border-radius: 30px; margin: 0 30px; transition: height 0.2s, background 0.1s; position: relative; overflow: hidden; }
        .row { display: flex; align-items: center; justify-content: center; }
        
        /* Pupils for looking left/right */
        .pupil { position: absolute; width: 40px; height: 50px; background: #000; border-radius: 50%; top: 20px; left: 15px; transition: transform 0.2s; visibility: hidden; }
        .looking .pupil { visibility: visible; }

        /* Mouth & Tongue */
        .mouth { width: 50px; height: 20px; border-bottom: 6px solid var(--white); border-radius: 50%; margin-top: 30px; position: relative; transition: all 0.3s; }
        .tongue { position: absolute; top: 15px; left: 10px; width: 30px; height: 0; background: var(--red); border-radius: 0 0 15px 15px; transition: height 0.2s cubic-bezier(0.17, 0.67, 0.6, 1.5); }
        .tongue-out { height: 35px; }

        /* Yawn / Open Mouth */
        .yawn-mouth { width: 60px; height: 60px; border: 6px solid var(--white); border-radius: 50%; }

        /* Scrunched Eyes (><) */
        .scrunched { background: transparent !important; height: 60px !important; }
        .scrunched::before, .scrunched::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 8px; background: var(--white); border-radius: 4px; }
        .eye-left.scrunched::before { transform: rotate(45deg); }
        .eye-left.scrunched::after { transform: rotate(-45deg); }
        .eye-right.scrunched::before { transform: rotate(-45deg); }
        .eye-right.scrunched::after { transform: rotate(45deg); }

        /* Sleepy Eyes */
        .sleepy { height: 10px !important; }

        /* Gauge */
        .gauge { width: 200px; height: 200px; border: 5px solid var(--white); border-radius: 50%; position: relative; }
        .needle { position: absolute; bottom: 50%; left: calc(50% - 2px); width: 4px; height: 90px; background: var(--red); transform-origin: bottom; transition: transform 0.2s; }

        /* Angry Elements */
        .angry-eye { width: 70px; height: 25px; background: var(--white); transform: rotate(20deg); border-radius: 5px; margin: 0 20px;}
        .angry-eye.right { transform: rotate(-20deg); }

        /* UI */
        #controls { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; }
        button { background: rgba(255,255,255,0.1); border: 1px solid #fff; color: #fff; padding: 12px 20px; border-radius: 8px; z-index: 10; font-weight: bold; cursor: pointer; }
        #stats { position: absolute; bottom: 20px; font-family: monospace; font-size: 12px; color: #666; text-align: center; width: 100%; }
        #status-msg { color: var(--blue); font-size: 10px; margin-top: 5px; height: 12px; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="initCompanion()">START COMPANION</button>
    </div>

    <div id="stage">
        <div id="face-idle" class="face active">
            <div class="row">
                <div id="l-eye" class="eye eye-left"><div class="pupil"></div></div>
                <div id="r-eye" class="eye eye-right"><div class="pupil"></div></div>
            </div>
            <div id="main-mouth" class="mouth">
                <div id="tongue" class="tongue"></div>
            </div>
        </div>

        <div id="face-speed" class="face">
            <div class="gauge"><div id="needle" class="needle"></div></div>
            <div style="margin-top:10px; color:var(--red); font-weight:bold;">SLOW DOWN!</div>
        </div>

        <div id="face-brake" class="face">
            <div class="row">
                <div class="angry-eye"></div>
                <div class="angry-eye right"></div>
            </div>
            <div class="mouth" style="border-bottom:none; border-top: 6px solid white; border-radius: 50%; height:10px;"></div>
        </div>
    </div>

    <div id="stats">
        SPD: <span id="s-val">0</span> | G: <span id="g-val">0</span> | TILT: <span id="t-val">0</span>
        <div id="status-msg">READY</div>
        <div id="wake-status">SCREEN TIMEOUT: ALLOWED</div>
    </div>

    <script>
        let currentSpeed = 0, gForce = 0, tilt = 0, isAnimating = false, wakeLock = null;
        let stationaryTimer = 0, isSleeping = false;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wake-status').innerText = "SCREEN TIMEOUT: PREVENTED";
                    document.getElementById('wake-status').style.color = "#77b5fe";
                }
            } catch (err) {}
        }

        function initCompanion() {
            requestWakeLock();
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => { if (res == 'granted') startMotion(); });
            } else { startMotion(); }

            navigator.geolocation.watchPosition((pos) => {
                currentSpeed = (pos.coords.speed || 0) * 2.237; 
                document.getElementById('s-val').innerText = Math.round(currentSpeed);
            }, null, { enableHighAccuracy: true });

            scheduleNextAction();
        }

        function startMotion() {
            window.addEventListener('devicemotion', (e) => {
                let rawG = e.accelerationIncludingGravity ? e.accelerationIncludingGravity.y : 0;
                gForce = Math.abs(rawG) < 1 ? 0 : rawG;
                document.getElementById('g-val').innerText = gForce.toFixed(2);
                
                let rawTilt = e.accelerationIncludingGravity ? e.accelerationIncludingGravity.x : 0;
                tilt = Math.abs(rawTilt) < 0.5 ? 0 : rawTilt * 5;
                document.getElementById('t-val').innerText = Math.round(tilt);
            });
        }

        function update() {
            const stage = document.getElementById('stage');
            const needle = document.getElementById('needle');
            const idleEyes = eyes();
            const statusMsg = document.getElementById('status-msg');
            
            stage.style.transform = `rotate(${tilt}deg)`;

            // Stationary/Sleep Logic
            if (currentSpeed < 1) {
                stationaryTimer++;
                if (stationaryTimer > 600 && !isAnimating) {
                    isSleeping = true;
                    idleEyes.forEach(e => e.classList.add('sleepy'));
                    statusMsg.innerText = "Zzz...";
                }
            } else {
                // WAKE UP ANIMATION
                if (isSleeping) {
                    isSleeping = false;
                    stationaryTimer = 0;
                    isAnimating = true;
                    statusMsg.innerText = "!";
                    
                    // Surprise pop open
                    idleEyes.forEach(e => {
                        e.classList.remove('sleepy');
                        e.style.height = '110px'; // Extra wide
                    });
                    
                    setTimeout(() => {
                        idleEyes.forEach(e => e.style.height = '90px');
                        isAnimating = false;
                        statusMsg.innerText = "AWAKE";
                    }, 600);
                }
                stationaryTimer = 0;
            }

            // Face Logic
            if (currentSpeed > 75) {
                switchFace('face-speed');
                needle.style.transform = `rotate(${(currentSpeed * 1.5) - 100}deg)`;
            } else if (gForce < -5) {
                switchFace('face-brake');
            } else {
                switchFace('face-idle');
                
                if (!isAnimating && !isSleeping) {
                    // Pupil tracking based on tilt
                    if (tilt > 15) { 
                        idleEyes.forEach(e => {
                            e.classList.add('looking');
                            e.querySelector('.pupil').style.transform = 'translateX(-20px)';
                        });
                    } else if (tilt < -15) { 
                        idleEyes.forEach(e => {
                            e.classList.add('looking');
                            e.querySelector('.pupil').style.transform = 'translateX(20px)';
                        });
                    } else {
                        idleEyes.forEach(e => {
                            e.classList.remove('looking');
                            e.querySelector('.pupil').style.transform = 'translateX(0)';
                        });
                    }
                }
            }
            requestAnimationFrame(update);
        }

        function switchFace(id) {
            document.querySelectorAll('.face').forEach(f => f.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function scheduleNextAction() {
            const nextInterval = Math.floor(Math.random() * 5000) + 7000;
            setTimeout(performRandomAction, nextInterval);
        }

        const eyes = () => document.querySelectorAll('#face-idle .eye');

        function performRandomAction() {
            const idleFace = document.getElementById('face-idle');
            if (!idleFace.classList.contains('active') || isAnimating || isSleeping) {
                scheduleNextAction();
                return;
            }

            isAnimating = true;
            const rand = Math.random();
            const mouth = document.getElementById('main-mouth');
            const tongue = document.getElementById('tongue');
            const e = eyes();

            if (rand < 0.15) { // YAWN
                mouth.classList.add('yawn-mouth');
                e.forEach(el => el.style.height = '40px');
                setTimeout(() => {
                    mouth.classList.remove('yawn-mouth');
                    e.forEach(el => el.style.height = '90px');
                    finishAction();
                }, 2000);
            } 
            else if (rand < 0.30) { // TONGUE + ><
                e.forEach(el => el.classList.add('scrunched'));
                tongue.classList.add('tongue-out');
                setTimeout(() => {
                    e.forEach(el => el.classList.remove('scrunched'));
                    tongue.classList.remove('tongue-out');
                    finishAction();
                }, 1500);
            }
            else if (rand < 0.40) { // ANGRY
                switchFace('face-brake');
                setTimeout(() => {
                    switchFace('face-idle');
                    finishAction();
                }, 1200);
            }
            else if (rand < 0.60) { // DOUBLE BLINK
                blink(() => blink(finishAction));
            }
            else { // BLINK
                blink(finishAction);
            }
        }

        function finishAction() {
            isAnimating = false;
            scheduleNextAction();
        }

        function blink(callback) {
            if (isSleeping) return;
            eyes().forEach(e => e.style.height = '5px');
            setTimeout(() => {
                eyes().forEach(e => e.style.height = '90px');
                if (callback) setTimeout(callback, 100);
            }, 100);
        }

        update();
    </script>
</body>
</html>
